
{% load custom_tags %} 
<div class="flex h-full grow flex-col bg-white pl-[var(--main-sidebar-width)] dark:bg-navy-750">
    
    <div class="flex h-18 w-full items-center justify-between pl-4 pr-1" >
        <p class="text-base tracking-wider text-slate-800 dark:text-navy-100">Pretest</p>
        <button
            @click="$store.global.isSidebarExpanded = false"
            class="btn size-7 rounded-full p-0 text-primary hover:bg-slate-300/20 focus:bg-slate-300/20 active:bg-slate-300/25 dark:text-accent-light/80 dark:hover:bg-navy-300/20 dark:focus:bg-navy-300/20 dark:active:bg-navy-300/25 xl:hidden">
            <svg
                xmlns="http://www.w3.org/2000/svg"
                class="size-6"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
            >
                <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M15 19l-7-7 7-7"/>
            </svg>
        </button>
    </div>

    <!-- ▀▄▀▄ Sidebar Panel Body -->
    <div
        x-data="{expandedItem:null}"
        class="h-[calc(100%-4.5rem)] overflow-x-hidden pb-6"
        x-init="$el._x_simplebar = new SimpleBar($el);" >
        <ul class="flex flex-1 flex-col px-4 font-inter">

            <!-- ▀▄▀▄ roadmap list -->
            <li>
                <a x-data="navLink"
                    href="{% roadmap_list_url user %}"
                    :class="isActive ? 'font-medium text-primary dark:text-accent-light' : 'text-slate-400 hover:text-slate-900 dark:text-navy-200 dark:hover:text-navy-50'"
                    class="flex items-center gap-2 py-2 text-xs-plus tracking-wide outline-hidden transition-colors duration-300 ease-in-out">
                    <svg xmlns="http://www.w3.org/2000/svg"
                        class="h-4 w-4 opacity-50 transition-all duration-300 group-hover:translate-x-1 group-hover:opacity-100"
                        viewBox="0 0 20 20"
                        fill="currentColor">
                        <path fill-rule="evenodd"
                            d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z"
                            clip-rule="evenodd" />
                    </svg> 
                    <span>Roadmap List</span>
                </a>
            </li>  
 
        </ul> 
    </div>

</div>
