<style>
    .legend-color{
        display:inline-block;
        width:16px;
        height:16px;
        border-radius:4px;
        margin-right:10px;
        flex-shrink:0;
    }

    .legend-unanswered{
        background:#e2e8f0;
    }

    .legend-answered{
        background:#22c55e;
    }

    .legend-active{
        background:#4f46e5;
    }
</style>

<div class="card p-5"> 
    <h3 class="font-semibold text-slate-700 dark:text-navy-100">
        Question Navigator
    </h3>

    <!-- ▀▄▀▄ question number -->
    <div class="mt-4 flex flex-wrap justify-center gap-2"> 
        {% for question in questions %} 
        <button
            type="button"
            class="question-number flex h-10 w-10 items-center justify-center rounded-lg border border-slate-300 bg-slate-100 text-slate-700 transition hover:bg-primary hover:text-white dark:border-navy-450 dark:bg-navy-600 dark:text-navy-100"
            data-index="{{ forloop.counter0 }}">

            {{ forloop.counter }}

        </button>
        {% endfor %}

    </div>

    <hr class="my-5">

    <!-- ▀▄▀▄ legend -->
    <div class="space-y-3 text-sm"> 
        <div class="flex items-center">
            <span class="legend-color legend-unanswered"></span>
            <span>Unanswered</span>
        </div> 
        <div class="flex items-center">
            <span class="legend-color legend-answered"></span>
            <span>Answered</span>
        </div> 
        <div class="flex items-center">
            <span class="legend-color legend-active"></span>
            <span>Active Question</span>
        </div>

    </div>
</div>
