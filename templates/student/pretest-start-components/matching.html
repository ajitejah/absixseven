<div class="mt-8" >

    <div class="space-y-5">

        {% for pair in question.random_pairs %}

        <div class="matching-row grid grid-cols-1 items-center gap-3 sm:grid-cols-12 sm:gap-4">

            <!-- LEFT -->
            <div class="min-w-0 sm:col-span-5">

                <div class="min-w-0 overflow-hidden rounded-xl border border-slate-300 bg-slate-100 p-4 font-medium break-words whitespace-normal">

                    {{ pair.left_text }}

                </div>

            </div>


            <!-- ARROW -->
            <div class="flex items-center justify-center text-slate-400 sm:col-span-2">

                <span class="text-xl sm:text-lg">
                    ➜
                </span>

            </div>


            <!-- DROP -->
            <div class="min-w-0 sm:col-span-5">

                <div
                    class="drop-zone flex min-h-[60px] min-w-0 w-full items-center overflow-hidden rounded-xl border-2 border-dashed border-slate-300 bg-white p-3 transition"
                    data-left="{{ pair.id }}"
                >

                    <span class="placeholder block min-w-0 max-w-full break-words whitespace-normal text-slate-400">

                        Drag the answer here

                    </span>

                </div>


                <input
                    type="hidden"
                    class="matching-input"
                    name="question_{{ question.id }}_pair_{{ pair.id }}"
                    data-pair-id="{{ pair.id }}"
                    value=""
                >

            </div>

        </div>

        {% endfor %}

    </div>


    <hr class="my-8 mt-4">


    <h4 class="mb-4 font-semibold">
        Answer Choices
    </h4>


    <div
        id="matching-options"
        class="flex flex-wrap gap-3"
    >

        {% for option in question.random_options %}

        <div
            draggable="true"
            class="drag-item min-w-0 max-w-full cursor-move overflow-hidden rounded-xl border border-primary bg-primary/10 px-4 py-3 break-words whitespace-normal transition hover:scale-105"
            data-id="{{ option.id }}"
        >

            {{ option.right_text }}

        </div>

        {% endfor %}

    </div>

</div>
