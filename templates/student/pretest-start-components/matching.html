<div class="mt-8">

    <div class="space-y-5">

        {% for pair in question.random_pairs %}

        <div
            class="grid grid-cols-12 gap-4 items-center matching-row">

            <!-- LEFT -->
            <div class="col-span-5">

                <div class="rounded-xl border border-slate-300 bg-slate-100 p-4 font-medium">

                    {{ pair.left_text }}

                </div>

            </div>

            <!-- ARROW -->
            <div class="col-span-2 flex justify-center">

                ➜

            </div>

            <!-- DROP -->
            <div class="col-span-5">

                <div
                    class="drop-zone flex min-h-[60px] items-center rounded-xl border-2 border-dashed border-slate-300 bg-white p-3 transition"
                    data-left="{{ pair.id }}">

                    <span class="placeholder text-slate-400">

                        Tarik jawaban ke sini

                    </span>

                </div>

                <input
                    type="hidden"
                    class="matching-input"
                    name="pair_{{ pair.id }}">

            </div>

        </div>

        {% endfor %}

    </div>

    <hr class="my-8">

    <h4 class="mb-4 font-semibold">

        Pilihan Jawaban

    </h4>

    <div
        id="matching-options"
        class="flex flex-wrap gap-3">

        {% for option in question.random_options %}

        <div
            draggable="true"
            class="drag-item cursor-move rounded-xl border border-primary bg-primary/10 px-4 py-3 transition hover:scale-105"
            data-id="{{ option.id }}">

            {{ option.right_text }}

        </div>

        {% endfor %}

    </div>

</div>

<script>

document.addEventListener("DOMContentLoaded",function(){

    let dragged=null;

    // ==========================
    // DRAG START
    // ==========================

    document.querySelectorAll(".drag-item").forEach(item=>{

        item.addEventListener("dragstart",function(){

            dragged=this;

            setTimeout(()=>{

                this.style.opacity=".3";

            },0);

        });

        item.addEventListener("dragend",function(){

            this.style.opacity="1";

        });

    });

    // ==========================
    // DROP ZONE
    // ==========================

    document.querySelectorAll(".drop-zone").forEach(zone=>{

        zone.addEventListener("dragover",function(e){

            e.preventDefault();

            this.classList.add("border-primary");

        });

        zone.addEventListener("dragleave",function(){

            this.classList.remove("border-primary");

        });

        zone.addEventListener("drop",function(e){

            e.preventDefault();

            this.classList.remove("border-primary");

            if(!dragged)
                return;

            // ----------------------------------
            // jika dropzone sudah ada jawaban
            // ----------------------------------

            const old=this.querySelector(".drag-item");

            if(old){

                document
                .getElementById("matching-options")
                .appendChild(old);

            }

            // ----------------------------------
            // jika jawaban dipakai di tempat lain
            // ----------------------------------

            document.querySelectorAll(".drop-zone").forEach(z=>{

                if(z!==this){

                    const exist=z.querySelector(
                        `[data-id="${dragged.dataset.id}"]`
                    );

                    if(exist){

                        document
                        .getElementById("matching-options")
                        .appendChild(exist);

                        z.querySelector(".matching-input").value="";

                        const ph=z.querySelector(".placeholder");

                        if(ph)
                            ph.style.display="block";

                    }

                }

            });

            // ----------------------------------
            // pindahkan
            // ----------------------------------

            const placeholder=this.querySelector(".placeholder");

            if(placeholder){

                placeholder.style.display="none";

            }

            this.appendChild(dragged);

            // ----------------------------------
            // simpan hidden input
            // ----------------------------------

            this.parentElement
                .querySelector(".matching-input")
                .value=dragged.dataset.id;

            // ----------------------------------
            // update progress
            // ----------------------------------

            if(typeof updateProgress==="function"){

                updateProgress();

            }

            dragged=null;

        });

    });

});
</script>
