<div class="card p-5">
    <div class="flex flex-col gap-4 lg:flex-row lg:items-center lg:justify-between">
        <div>
            <h2 class="text-2xl font-semibold text-slate-800 dark:text-navy-100">
                {{ pretest.title }}
            </h2>
            <p class="mt-1 text-slate-500">
                {{ pretest.description }}
            </p>
        </div>
        <div class="flex flex-wrap gap-2">
            <span class="badge rounded-full bg-primary/10 text-primary">
                {{ pretest.question_count }} Questions
            </span>
            <span class="badge rounded-full bg-info/10 text-info">
                {{ pretest.duration }} Minutes
            </span>
            <span class="badge rounded-full bg-success/10 text-success">
                {{ pretest.question_set.lesson.name }}
            </span>
        </div>
    </div>
</div>
